<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10141c" media="(prefers-color-scheme: dark)">
  <meta name="description" content="A clean, accessible Sudoku game with notes, hints, undo, and offline play.">
  <title>Sudoku</title>
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTIiIGZpbGw9IiMyNTYzZWIiLz48ZyBmaWxsPSJub25lIiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS13aWR0aD0iMyI+PHJlY3QgeD0iOCIgeT0iOCIgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQ4IiByeD0iMyIvPjxwYXRoIGQ9Ik0yNCA4djQ4TTQwIDh2NDhNOCAyNGg0OE04IDQwaDQ4Ii8+PC9nPjx0ZXh0IHg9IjMyIiB5PSIzOSIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjZmZmZmZmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj41PC90ZXh0Pjwvc3ZnPg==">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#board">Skip to board</a>

  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="24" height="24" focusable="false">
            <rect x="1" y="1" width="30" height="30" rx="7" fill="currentColor" opacity="0.14"></rect>
            <path d="M11 3v26M21 3v26M3 11h26M3 21h26" fill="none" stroke="currentColor" stroke-width="2"></path>
          </svg>
        </span>
        <h1 class="app-title">Sudoku</h1>
      </div>

      <div class="topbar-status" aria-label="Game statistics">
        <span class="timer" id="timer" role="timer" aria-label="Elapsed time">00:00</span>
        <span class="stat stat--mistakes" id="mistakes" aria-label="Mistakes 0 of 3">
          <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="m9 9 6 6M15 9l-6 6"></path>
          </svg>
          <span class="stat-value" id="mistakes-value">0/3</span>
        </span>
        <span class="stat stat--hints" id="hints" aria-label="Hints used: 0">
          <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 18h6"></path>
            <path d="M10 22h4"></path>
            <path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V18h6v-1.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"></path>
          </svg>
          <span class="stat-value" id="hints-value">0</span>
        </span>
      </div>

      <button class="icon-btn" id="pause" type="button"
              aria-label="Pause" aria-pressed="false"
              aria-controls="pause-menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"></rect>
          <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"></rect>
        </svg>
      </button>
    </header>

    <main class="game">
      <section class="board-area" aria-label="Puzzle">
        <div class="board-wrap">
          <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>
          <div class="board-pause-overlay" id="pause-overlay" hidden>
            <span class="pause-label">Paused</span>
          </div>
        </div>
      </section>

      <aside class="controls" aria-label="Game controls">
        <div class="stats stats--side" aria-label="Game statistics">
          <span class="stat" id="mistakes-side" aria-label="Mistakes 0 of 3">Mistakes 0/3</span>
          <span class="stat" id="hints-side" aria-label="Hints used: 0">Hints 0</span>
        </div>

        <div class="tools" role="group" aria-label="Tools">
          <button class="tool-btn" id="undo" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 14 4 9l5-5"></path>
              <path d="M4 9h9a6 6 0 0 1 0 12h-3"></path>
            </svg>
            <span>Undo</span>
          </button>
          <button class="tool-btn" id="erase" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 15 13 6l5 5-9 9H5z"></path>
              <path d="m14 7 3-3 4 4-3 3"></path>
              <path d="M9 20h11"></path>
            </svg>
            <span>Erase</span>
          </button>
          <button class="tool-btn" id="notes" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
            </svg>
            <span>Notes</span>
          </button>
          <button class="tool-btn" id="hint" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M9 18h6"></path>
              <path d="M10 22h4"></path>
              <path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V18h6v-1.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"></path>
            </svg>
            <span>Hint</span>
          </button>
          <button class="tool-btn" id="redo" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m15 14 5-5-5-5"></path>
              <path d="M20 9h-9a6 6 0 0 0 0 12h3"></path>
            </svg>
            <span>Redo</span>
          </button>
        </div>

        <h2 class="sr-only" id="number-pad-title">Numbers</h2>
        <div class="numpad" id="number-pad" role="group" aria-labelledby="number-pad-title"></div>
      </aside>
    </main>

    <div class="pause-menu-overlay" id="pause-menu" role="dialog"
         aria-modal="true" aria-labelledby="pause-title" hidden>
      <div class="pause-sheet" id="pause-sheet">
        <div class="pause-head">
          <h2 id="pause-title">Paused</h2>
          <button class="icon-btn" id="pause-close" type="button"
                  aria-label="Resume">×</button>
        </div>

        <button class="btn btn-primary" id="resume" type="button">Resume</button>

        <section class="menu-section">
          <h3>New game</h3>
          <div class="segmented" id="difficulty-picker" role="group"
               aria-label="Difficulty">
            <button type="button" data-difficulty="easy" aria-pressed="true">Easy</button>
            <button type="button" data-difficulty="medium" aria-pressed="false">Medium</button>
            <button type="button" data-difficulty="hard" aria-pressed="false">Hard</button>
            <button type="button" data-difficulty="expert" aria-pressed="false">Expert</button>
          </div>
          <button class="btn" id="new-game" type="button">Start new game</button>
        </section>

        <section class="menu-section">
          <h3>Theme</h3>
          <div class="segmented" id="theme-picker" role="group" aria-label="Theme">
            <button type="button" data-theme="auto" aria-pressed="true">Auto</button>
            <button type="button" data-theme="light" aria-pressed="false">Light</button>
            <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
          </div>
        </section>

        <section class="menu-section">
          <button class="btn" id="restart" type="button">Restart puzzle</button>
        </section>

        <div class="confirm-row" id="pause-confirm" hidden>
          <p id="pause-confirm-text"></p>
          <div class="confirm-actions">
            <button class="btn" id="confirm-cancel" type="button">Cancel</button>
            <button class="btn btn-primary" id="confirm-ok" type="button">Confirm</button>
          </div>
        </div>

        <details class="shortcuts">
          <summary>Keyboard shortcuts</summary>
          <dl class="legend">
            <div class="legend-row"><dt><kbd>1</kbd>&ndash;<kbd>9</kbd></dt><dd>Enter digit / note</dd></div>
            <div class="legend-row"><dt><kbd>Arrows</kbd></dt><dd>Move selection</dd></div>
            <div class="legend-row"><dt><kbd>N</kbd></dt><dd>Toggle notes</dd></div>
            <div class="legend-row"><dt><kbd>E</kbd> / <kbd>Del</kbd></dt><dd>Erase</dd></div>
            <div class="legend-row"><dt><kbd>Ctrl</kbd>+<kbd>Z</kbd></dt><dd>Undo / redo</dd></div>
            <div class="legend-row"><dt><kbd>H</kbd></dt><dd>Hint</dd></div>
            <div class="legend-row"><dt><kbd>P</kbd> / <kbd>Space</kbd> / <kbd>Esc</kbd></dt><dd>Pause / resume</dd></div>
            <div class="legend-row"><dt><kbd>M</kbd></dt><dd>Cycle theme</dd></div>
          </dl>
        </details>
      </div>
    </div>

    <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-body" hidden>
      <div class="modal">
        <h2 class="modal-title" id="modal-title"></h2>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-actions" id="modal-actions"></div>
      </div>
    </div>

    <p class="sr-only" id="sr-status" role="status" aria-live="polite" aria-atomic="true"></p>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
